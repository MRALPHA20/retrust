[project]
name = "retrust"
version = "0.1.0"
description = "Cybersecurity evidence for OT hardware procurement"
readme = "README.md"
# Named as in the LICENSE copyright line, so the package does not publish
# contributors' personal addresses.
authors = [{ name = "The ReTrust Authors" }]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ics", "ot", "scada", "procurement", "vulnerability", "csaf", "iec-62443"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Manufacturing",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# No runtime dependencies. Everything ReTrust needs is in the standard library,
# so an air-gapped procurement machine can run it from a clone.
dependencies = []

[project.optional-dependencies]
# pytest is for developing the tool, not using it. Screenshot trimming needs
# nothing: the content height is measured off the PNG scanlines in stdlib.
dev = ["pytest>=7"]
docs = ["reportlab>=4", "playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/MRALPHA20/retrust"
Documentation = "https://github.com/MRALPHA20/retrust/blob/main/docs/README.md"
Demo = "https://retrust-q2tr.onrender.com/"
Changelog = "https://github.com/MRALPHA20/retrust/blob/main/CHANGELOG.md"
Issues = "https://github.com/MRALPHA20/retrust/issues"

[project.scripts]
retrust = "retrust.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
