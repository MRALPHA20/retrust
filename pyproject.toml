[project]
name = "retrust"
version = "0.1.0"
description = "Score OT hardware for cyber risk before you buy it"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ics", "ot", "scada", "procurement", "vulnerability", "csaf", "iec-62443"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# No runtime dependencies. Everything ReTrust needs is in the standard library,
# so an air-gapped procurement machine can run it from a clone.
dependencies = []

[project.optional-dependencies]
# pytest is for developing the tool, not using it. Screenshot trimming needs
# nothing: the content height is measured off the PNG scanlines in stdlib.
dev = ["pytest>=7"]
docs = ["reportlab>=4", "playwright>=1.40"]

[project.scripts]
retrust = "retrust.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrust*"]

[tool.setuptools.package-data]
retrust = ["static/fonts/*.woff2", "static/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
