services:
  - type: web
    name: retrust
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash scripts/render-build.sh
    startCommand: python -u -m retrust.cli serve --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: RETRUST_HOSTED
        value: "1"
      - key: RETRUST_BUILD_LEV_HISTORY
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
